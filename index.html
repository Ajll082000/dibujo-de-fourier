<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dibujo de Fourier — Alejandro López</title>
<meta name="description" content="Sube cualquier imagen y mira cómo se redibuja con epiciclos de Fourier, de 2 a 8192 círculos. Por Alejandro López.">
<meta name="theme-color" content="#0b0d0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d0c'/%3E%3Ccircle cx='13' cy='16' r='8' fill='none' stroke='%23ece7da' stroke-width='1.6'/%3E%3Ccircle cx='21' cy='16' r='3.4' fill='none' stroke='%23ff7a4a' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4.5 14.5v3.2A2.3 2.3 0 0 0 6.8 20h10.4a2.3 2.3 0 0 0 2.3-2.3v-3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5.5v13M16 5.5v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4.5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="m4 17 5-4.5 3.5 3L15.5 13 20 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <header class="masthead">
    <h1>Dibujo de <em>Fourier</em></h1>
    <p>Sube cualquier imagen. Se convierte en un solo trazo continuo que se redibuja con círculos giratorios, de 2 hasta 8192, y al final revela su color.</p>
  </header>

  <aside class="controls" aria-label="Controles">
    <section class="group">
      <h2>Imagen</h2>
      <label class="drop" id="drop" tabindex="0">
        <span class="drop-thumb"><img id="thumb" alt=""><svg class="ico"><use href="#i-image"/></svg></span>
        <span class="drop-text">
          <strong id="fname">Elegir o arrastrar una imagen</strong>
          <small>JPG, PNG, WEBP, SVG, GIF, AVIF · también puedes pegar con Ctrl+V</small>
        </span>
        <svg class="ico ico-up"><use href="#i-upload"/></svg>
        <input type="file" id="file" accept="image/*,.svg" hidden>
      </label>
      <div class="field">
        <label for="mode">Modo de trazo</label>
        <select id="mode">
          <option value="edges">Bordes · fotos e ilustraciones</option>
          <option value="contour">Contorno · logos, siluetas, SVG</option>
        </select>
      </div>
      <div class="field">
        <div class="field-head"><label for="detail">Detalle</label><output id="detailLbl">5 / 10</output></div>
        <input type="range" id="detail" min="1" max="10" step="1" value="5">
      </div>
      <label class="check"><input type="checkbox" id="showEdges"><span>Ver el trazo extraído</span></label>
    </section>

    <section class="group">
      <h2>Animación</h2>
      <div class="row">
        <div class="field">
          <label for="maxN">Círculos hasta</label>
          <select id="maxN"><option>1024</option><option>2048</option><option>4096</option><option selected>8192</option></select>
        </div>
        <div class="field">
          <div class="field-head"><label for="speed">Seg. por nivel</label><output id="speedLbl">2.4 s</output></div>
          <input type="range" id="speed" min="1" max="4" step="0.1" value="2.4">
        </div>
      </div>
      <div class="field">
        <label for="format">Formato del lienzo y del video</label>
        <select id="format">
          <option value="screen">Ajustado a mi pantalla</option>
          <option value="916">Vertical 9:16 · 1080×1920</option>
          <option value="169">Horizontal 16:9 · 1920×1080</option>
          <option value="11">Cuadrado 1:1 · 1440×1440</option>
        </select>
      </div>
    </section>

    <section class="group">
      <h2>Textos</h2>
      <div class="field"><label for="title">Título</label><input type="text" id="title" value="Atardecer" maxlength="40"></div>
      <div class="row">
        <div class="field"><label for="brand">Marca</label><input type="text" id="brand" value="Fourier" maxlength="20"></div>
        <div class="field"><label for="handle">Usuario</label><input type="text" id="handle" value="" placeholder="@usuario" maxlength="28"></div>
      </div>
      <div class="row">
        <div class="field"><label for="sign">Firma</label><input type="text" id="sign" value="Alejandro López" maxlength="32"></div>
        <div class="field"><label for="endText">Texto final</label><input type="text" id="endText" value="sígueme" maxlength="24"></div>
      </div>
    </section>

    <div class="actions">
      <button class="btn primary" id="play" type="button"><svg class="ico"><use href="#i-replay"/></svg>Reproducir</button>
      <button class="btn" id="record" type="button"><svg class="ico"><use href="#i-rec"/></svg><span>Grabar video</span></button>
      <button class="btn" id="save" type="button" hidden><svg class="ico"><use href="#i-down"/></svg>Descargar video</button>
      <button class="btn" id="snap" type="button"><svg class="ico"><use href="#i-down"/></svg>Guardar PNG</button>
    </div>
  </aside>

  <main class="stagewrap">
    <div class="stage" id="stage"><canvas id="cv" aria-label="Animación del dibujo de Fourier" role="img"></canvas></div>
    <div class="transport">
      <button class="icon-btn" id="pause" type="button" aria-label="Pausa"><svg class="ico"><use id="pauseUse" href="#i-pause"/></svg></button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Posición de la animación">
      <span class="time" id="time">0.0 / 0.0 s</span>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <footer class="sig">
    <span class="sig-name">Alejandro López</span>
    <span class="sig-note">Diseño y desarrollo</span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
